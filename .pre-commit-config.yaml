exclude: '^public/'

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, --force-scope, feat, fix, chore, test, infra, docs]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json

  - repo: local
    hooks:
      - id: nixfmt
        name: Format Nix files
        entry: nixfmt
        language: system
        files: \.nix$

      - id: pint
        name: Laravel Pint
        entry: bash -c "if [ -f ./vendor/bin/pint ]; then ./vendor/bin/pint \"\$@\"; elif [ -f apps/archeo/vendor/bin/pint ]; then ./apps/archeo/vendor/bin/pint \"\$@\"; elif [ -f apps/etno/vendor/bin/pint ]; then ./apps/etno/vendor/bin/pint \"\$@\"; else echo 'Laravel Pint skipped (dependencies not installed)'; fi" --
        language: system
        files: \.php$
        pass_filenames: true

      - id: phpstan-archeo
        name: PHPStan Archeo
        entry: bash -c "if [ -f apps/archeo/vendor/bin/phpstan ]; then cd apps/archeo && ./vendor/bin/phpstan analyse --memory-limit=2G; else echo 'Archeo PHPStan skipped (dependencies not installed)'; fi"
        language: system
        files: \.php$
        pass_filenames: false

      - id: phpstan-etno
        name: PHPStan Etno
        entry: bash -c "if [ -f apps/etno/vendor/bin/phpstan ]; then cd apps/etno && ./vendor/bin/phpstan analyse --memory-limit=2G; else echo 'Etno PHPStan skipped (dependencies not installed)'; fi"
        language: system
        files: \.php$
        pass_filenames: false
