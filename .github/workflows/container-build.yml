name: Build and Push Container

on:
  pull_request:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [archeo, etno]

    steps:
      - uses: actions/checkout@v4

      - name: Resolve refs and image tag
        id: refs
        run: |
          echo "frontend_ref=main" >> "$GITHUB_OUTPUT"
          echo "image_tag=${{ matrix.module }}-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Validate required secrets
        run: |
          if [ "${{ matrix.module }}" = "archeo" ]; then
            echo "Checking VITE_MAPBOX_TOKEN_ARCHEO"
            echo "${{ secrets.VITE_MAPBOX_TOKEN_ARCHEO }}" | wc -c
          else
            echo "Checking VITE_MAPBOX_TOKEN_ETNO"
            echo "${{ secrets.VITE_MAPBOX_TOKEN_ETNO }}" | wc -c
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.module }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Containerfile
          push: true
          build-args: |
            MODULE=${{ matrix.module }}
            FRONTEND_REF=${{ steps.refs.outputs.frontend_ref }}
            VITE_REMOTE_URL=${{ secrets.VITE_REMOTE_URL }}
          secrets: |
            "mapbox_token=${{ secrets[matrix.module == 'archeo' && 'VITE_MAPBOX_TOKEN_ARCHEO' || 'VITE_MAPBOX_TOKEN_ETNO'] }}"
          tags: ghcr.io/metafori-studio/collection-toolbox:${{ steps.refs.outputs.image_tag }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
