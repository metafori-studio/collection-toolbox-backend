name: Build and Push Container

on:
  pull_request:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [archeo, etno]

    steps:
      - uses: actions/checkout@v4

      - name: Resolve refs and image tag
        id: refs
        run: |
          echo "backend_ref=${{ github.head_ref || github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "frontend_ref=main" >> "$GITHUB_OUTPUT"
          echo "image_tag=${{ matrix.module }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.module }}
        uses: docker/build-push-action@v6
        with:
          context: containers
          file: containers/Containerfile
          push: true
          build-args: |
            MODULE=${{ matrix.module }}
            BACKEND_REF=${{ steps.refs.outputs.backend_ref }}
            FRONTEND_REF=${{ steps.refs.outputs.frontend_ref }}
            VITE_REMOTE_URL=${{ secrets.VITE_REMOTE_URL }}
            VITE_MAPBOX_TOKEN=${{ secrets.VITE_MAPBOX_TOKEN }}
          tags: ghcr.io/metafori-studio/collection-toolbox:${{ steps.refs.outputs.image_tag }}
