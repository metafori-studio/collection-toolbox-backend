name: Build and Push Container

on:
  pull_request:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      module:
        description: 'Module to build'
        required: true
        type: choice
        options:
          - archeo
          - etno
      backend_ref:
        description: 'Backend branch or tag'
        required: true
        default: 'main'
      frontend_ref:
        description: 'Frontend branch or tag (collection-toolbox-frontend)'
        required: true
        default: 'main'

permissions:
  contents: read
  packages: write
  pull-requests: write

concurrency:
  group: container-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    outputs:
      archeo: ${{ steps.filter.outputs.archeo }}
      etno: ${{ steps.filter.outputs.etno }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            shared: &shared
              - 'app-modules/core/**'
              - 'app-modules/monitoring/**'
              - 'composer.json'
              - 'composer.lock'
              - '.github/workflows/container-build.yml'
            archeo:
              - *shared
              - 'apps/archeo/**'
              - 'app-modules/archeo/**'
            etno:
              - *shared
              - 'apps/etno/**'
              - 'app-modules/etno/**'
              - 'app-modules/opensearch/**'

  build:
    needs: changes
    # `changes` is skipped for release/workflow_dispatch; always() lets build run anyway.
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [archeo, etno]

    steps:
      - name: Check module relevance
        id: guard
        env:
          CHANGED: ${{ needs.changes.outputs[matrix.module] }}
        run: |
          echo "mapbox_secret=VITE_MAPBOX_TOKEN_$(echo '${{ matrix.module }}' | tr '[:lower:]' '[:upper:]')" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "release" ]] && [[ "${{ github.ref_name }}" != "${{ matrix.module }}"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && [[ "${{ inputs.module }}" != "${{ matrix.module }}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" ]] && [[ "$CHANGED" != "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: steps.guard.outputs.skip != 'true'
        with:
          ref: ${{ inputs.backend_ref || github.ref }}
          persist-credentials: false

      - name: Resolve refs and image tag
        id: refs
        if: steps.guard.outputs.skip != 'true'
        run: |
          echo "frontend_ref=${{ inputs.frontend_ref || 'main' }}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "image_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${{ matrix.module }}-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate required secrets
        if: steps.guard.outputs.skip != 'true'
        env:
          MAPBOX_TOKEN: ${{ secrets[steps.guard.outputs.mapbox_secret] }}
        run: |
          test -n "$MAPBOX_TOKEN" || { echo "Missing ${{ steps.guard.outputs.mapbox_secret }}"; exit 1; }

      - name: Set up Docker Buildx
        if: steps.guard.outputs.skip != 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to ghcr.io
        if: steps.guard.outputs.skip != 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.module }}
        if: steps.guard.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/${{ matrix.module }}/Containerfile
          push: true
          build-args: |
            FRONTEND_REF=${{ steps.refs.outputs.frontend_ref }}
          secrets: |
            mapbox_token=${{ secrets[steps.guard.outputs.mapbox_secret] }}
          tags: ghcr.io/metafori-studio/collection-toolbox:${{ steps.refs.outputs.image_tag }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}

      - name: Report build status
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          outcome="${{ steps.build.outcome }}"
          icon=$([[ "$outcome" == "success" ]] && echo "✅" || echo "❌")
          echo "### ${icon} Docker build \`${{ matrix.module }}\`: ${outcome}" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: \`${{ steps.refs.outputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Post build status to pull request
        if: always() && github.event_name == 'pull_request' && steps.guard.outputs.skip != 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const module = '${{ matrix.module }}';
            const outcome = '${{ steps.build.outcome }}';
            const icon = outcome === 'success' ? '✅' : '❌';
            const tag = '${{ steps.refs.outputs.image_tag }}';
            const marker = `<!-- docker-build-status:${module} -->`;
            const body = `${marker}\n${icon} **Docker build \`${module}\`**: ${outcome} (tag: \`${tag}\`)`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
