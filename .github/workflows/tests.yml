name: Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      archeo: ${{ steps.filter.outputs.archeo }}
      art: ${{ steps.filter.outputs.art }}
      etno: ${{ steps.filter.outputs.etno }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            shared: &shared
              - 'app-modules/core/**'
              - 'app-modules/monitoring/**'
              - 'composer.json'
              - 'composer.lock'
              - '.github/workflows/_tests-template.yml'
              - '.github/workflows/tests.yml'
            archeo:
              - *shared
              - 'apps/archeo/**'
              - 'app-modules/archeo/**'
            art:
              - *shared
              - 'apps/art/**'
            etno:
              - *shared
              - 'apps/etno/**'
              - 'app-modules/etno/**'
              - 'app-modules/opensearch/**'

  archeo:
    needs: changes
    if: needs.changes.outputs.archeo == 'true'
    uses: ./.github/workflows/_tests-template.yml
    with:
      app: archeo

  art:
    needs: changes
    if: needs.changes.outputs.art == 'true'
    uses: ./.github/workflows/_tests-template.yml
    with:
      app: art

  etno:
    needs: changes
    if: needs.changes.outputs.etno == 'true'
    uses: ./.github/workflows/_tests-template.yml
    with:
      app: etno
      opensearch: true

  tests-complete:
    needs: [changes, archeo, art, etno]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no upstream job failed
        run: |
          results="${{ needs.changes.result }} ${{ needs.archeo.result }} ${{ needs.art.result }} ${{ needs.etno.result }}"
          echo "Results: changes=${{ needs.changes.result }} archeo=${{ needs.archeo.result }} art=${{ needs.art.result }} etno=${{ needs.etno.result }}"
          for r in $results; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::An upstream job did not pass"
              exit 1
            fi
          done
          echo "All jobs passed or were skipped."
