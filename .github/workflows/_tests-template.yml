name: Reusable Tests Template

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      opensearch:
        required: false
        type: boolean
        default: false

jobs:
  tests:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Start OpenSearch
      if: inputs.opensearch == true
      run: |
        docker run -d --name opensearch -p 9200:9200 -e "discovery.type=single-node" -e "DISABLE_SECURITY_PLUGIN=true" opensearchproject/opensearch:3.5.0
        echo "Waiting for OpenSearch to start..."
        for i in {1..30}; do
          if curl -s http://localhost:9200/_cluster/health | grep -q -E '"status":"(green|yellow)"'; then
            echo "OpenSearch is ready!"
            exit 0
          fi
          sleep 2
        done
        echo "OpenSearch failed to start"
        exit 1

    - name: Install nixfmt
      run: |
        curl -L https://github.com/NixOS/nixfmt/releases/download/v1.2.0/nixfmt \
          -o /usr/local/bin/nixfmt
        echo "aa43e06e2e98d07f9393a8dc73978e0df79bad15d7f84fcd838e15557eb056ee  /usr/local/bin/nixfmt" \
          | sha256sum --check
        chmod +x /usr/local/bin/nixfmt

    - name: Setup PHP
      uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # master
      with:
        php-version: '8.5'
        extensions: ctype, curl, dom, fileinfo, filter, hash, mbstring, openssl, pcre, pdo, pdo_pgsql, session, tokenizer, xml
        coverage: none

    - name: Install composer packages
      working-directory: apps/${{ inputs.app }}
      run: composer install

    - name: Install npm packages
      working-directory: apps/${{ inputs.app }}
      run: npm ci

    - name: Run setup (install dependencies, create .env, generate app key, run migrations, build frontend)
      working-directory: apps/${{ inputs.app }}
      run: composer run setup

    - name: Run prek on all files (PHPStan, Laravel Pint, etc.)
      uses: j178/prek-action@0bb87d7f00b0c99306c8bcb8b8beba1eb581c037 # v1.1.1
      with:
        prek-version: '0.3.4'

    - name: Run Tests
      working-directory: apps/${{ inputs.app }}
      run: composer run test
