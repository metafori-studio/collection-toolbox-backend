name: Reusable Tests Template

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      opensearch:
        required: false
        type: boolean
        default: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Start OpenSearch
      if: inputs.opensearch == true
      run: |
        docker run -d --name opensearch -p 9200:9200 -e "discovery.type=single-node" -e "DISABLE_SECURITY_PLUGIN=true" opensearchproject/opensearch:3.5.0
        echo "Waiting for OpenSearch to start..."
        attempts=0
        until curl -s http://localhost:9200/_cluster/health | grep -q -E '"status":"(green|yellow)"'; do
          attempts=$((attempts + 1))
          if [ "$attempts" -ge 30 ]; then
            echo "OpenSearch failed to start"
            exit 1
          fi
          sleep 2
        done
        echo "OpenSearch is ready!"

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
      with:
        php-version: '8.5'
        extensions: ctype, curl, dom, fileinfo, filter, hash, mbstring, openssl, pcre, pdo, pdo_pgsql, session, tokenizer, xml
        coverage: none

    - name: Install composer packages
      working-directory: apps/${{ inputs.app }}
      run: composer install

    - name: Install npm packages
      working-directory: apps/${{ inputs.app }}
      run: npm ci

    - name: Run setup (install dependencies, create .env, generate app key, run migrations, build frontend)
      working-directory: apps/${{ inputs.app }}
      run: composer run setup

    - name: Run Tests
      working-directory: apps/${{ inputs.app }}
      run: composer run test
